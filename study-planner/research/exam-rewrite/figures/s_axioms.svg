<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="Four nonnegative masses define the event model"><title>Four nonnegative masses define the event model</title><defs><marker id="exam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6589a0"/></marker></defs><text x="350" y="31" font-size="24" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">Four nonnegative masses define the event model</text><text x="270" y="78" font-size="22" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">B absent</text><text x="490" y="78" font-size="22" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">B present</text><text x="80" y="145" font-size="20" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">A absent</text><text x="80" y="255" font-size="20" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">A present</text><rect x="170" y="100" width="200" height="85" rx="8" fill="#e8f0f5" stroke="#91abba"/><text x="270.0" y="150.5" font-size="30" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">.10</text><rect x="390" y="100" width="200" height="85" rx="8" fill="#e8f0f5" stroke="#91abba"/><text x="490.0" y="150.5" font-size="30" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">.30</text><rect x="170" y="210" width="200" height="85" rx="8" fill="#e8f0f5" stroke="#91abba"/><text x="270.0" y="260.5" font-size="30" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">.40</text><rect x="390" y="210" width="200" height="85" rx="8" fill="#e8f0f5" stroke="#91abba"/><text x="490.0" y="260.5" font-size="30" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">.20</text><text x="350" y="340" font-size="25" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">Exactly one: .40 + .30 = .70</text></svg>