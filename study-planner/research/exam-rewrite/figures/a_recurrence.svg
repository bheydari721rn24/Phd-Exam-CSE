<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410" role="img" aria-label="Critical logarithmic toll counted one complete level at a time"><title>Critical logarithmic toll counted one complete level at a time</title><defs><marker id="exam-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6589a0"/></marker></defs><text x="350" y="31" font-size="24" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">Critical logarithmic toll counted one complete level at a time</text><rect x="60" y="75" width="580" height="48" rx="8" fill="#e8f0f5" stroke="#91abba"/><text x="350.0" y="107.0" font-size="24" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">Depth 0: 1 node × 8 × 3 = 24</text><rect x="60" y="140" width="580" height="48" rx="8" fill="#e8f0f5" stroke="#91abba"/><text x="350.0" y="172.0" font-size="24" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">Depth 1: 2 nodes × 4 × 2 = 16</text><rect x="60" y="205" width="580" height="48" rx="8" fill="#e8f0f5" stroke="#91abba"/><text x="350.0" y="237.0" font-size="24" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">Depth 2: 4 nodes × 2 × 1 = 8</text><rect x="60" y="270" width="580" height="48" rx="8" fill="#e8f0f5" stroke="#91abba"/><text x="350.0" y="302.0" font-size="24" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">Leaves: 8 nodes × base cost 1 = 8</text><text x="350" y="370" font-size="25" text-anchor="middle" fill="#25394b" font-family="STIX Two Math">Total at n = 8: 24 + 16 + 8 + 8 = 56</text></svg>